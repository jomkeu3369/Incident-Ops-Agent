[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-ops-agent"
version = "0.1.0"
description = "Incident-Ops-Agent FastAPI Multi-Agent Layer (AG-UI, A2A, MCP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "python-dotenv>=1.0.1",
    "openai>=2.0.0",
    "langgraph>=0.4.0",
    "langsmith>=0.3.0",
    "mcp>=1.6.0",
    "ag-ui-protocol>=0.1.7",
    "a2a-sdk>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]
eval = [
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eval = ["datasets/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
