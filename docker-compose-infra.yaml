services:
  mysql:
    image: mysql:8.0
    container_name: incident-ops-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-incident_ops}
      MYSQL_USER: ${MYSQL_USER:-ops_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ops_password_1234}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_1234}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # TCP로 확인한다. 소켓(localhost) ping은 최초 초기화용 임시 서버에도 성공한다
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - incident-ops-net

  redis:
    image: redis:7-alpine
    container_name: incident-ops-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - incident-ops-net

  caddy:
    image: caddy:2-alpine
    container_name: incident-ops-caddy
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - incident-ops-net

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  incident-ops-net:
    name: incident-ops-net
    driver: bridge
