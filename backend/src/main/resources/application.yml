spring:
  application:
    name: incident-ops-backend
  ai:
    mcp:
      server:
        name: ${spring.application.name}
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
