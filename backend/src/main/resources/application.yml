server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: incident-ops-backend

  ai:
    mcp:
      server:
        name: ${spring.application.name}
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
        capabilities:
          resource: true
          prompt: false
          completion: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/incident_ops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:ops_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ops_password_1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  flyway:
    # Start existing databases at version 0 so the idempotent baseline also covers partial schemas.
    baseline-on-migrate: true
    baseline-version: "0"

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.incidentops.backend.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
  internal-investigator-token: ${INTERNAL_INVESTIGATOR_TOKEN:}
